<aside class="sidebar">
  <div class="sidebar-head">
    <figure>
      <img src="{{ site.data.profile.avatar | relative_url }}" alt="{{ site.data.profile.avatar_alt }}"
           width="132" height="132" />
    </figure>

    <div>
      <h1 class="name">{{ site.data.profile.name }}</h1>
      <p class="role">{{ site.data.profile.role }}</p>
    </div>
  </div>

  <div class="details">
    {%- for e in site.data.profile.emails %}
    <p><a href="mailto:{{ e }}">{{ e }}</a></p>
    {%- endfor %}
  </div>

  <div class="social">
    {%- for s in site.data.profile.socials %}
    <a href="{{ s.url | relative_url }}" target="_blank" rel="noopener" aria-label="{{ s.label }}"><i class="{{ s.icon }}" aria-hidden="true"></i></a>
    {%- endfor %}
  </div>

  <nav aria-label="Sections">
    <ul>
      {%- for n in site.data.nav %}
      <li><a href="#{{ n.anchor }}">{{ n.label }}</a></li>
      {%- endfor %}
    </ul>
  </nav>
</aside>
