  summary: 'Robots asked to do something impossible tend to try anyway. This builds a synthetic dataset
    of five ways a task can be unsolvable, from a missing item to an ethical refusal, then fine-tunes
    a vision-language model to spot them and say why. Refusal accuracy goes from 10% to 78% on the
    generated images, and 81% in Habitat-Sim, a renderer it never trained on.'
